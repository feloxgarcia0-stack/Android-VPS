name: Android Interactivo - Lógica Corregida

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Preparar Entorno Gráfico (Pantalla Virtual y VNC)
        run: |
          echo "Instalando dependencias..."
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xfce4 xfce4-goodies dbus-x11 x11-xserver-utils xorg xvfb x11vnc autocutsel
          echo "Iniciando pantalla virtual y servidor VNC en segundo plano..."
          Xvfb :1 -screen 0 1280x720x24 &
          x11vnc -display :1 -nopw -listen localhost -xkb -ncache 10 -ncache_cr -forever &

      - name: 2. Iniciar Emulador de Android en Segundo Plano
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31 # Android 12
          arch: x86_64
          # Le decimos al emulador que use nuestra pantalla virtual
          emulator-options: -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          # El script se ejecuta DESPUÉS de que el emulador esté listo
          # Lo dejamos en segundo plano para que el siguiente paso pueda ejecutarse
          script: |
            echo "El emulador ha arrancado y está listo."
            
      - name: 3. Conectar con playit.gg y Mantener Activo (Paso Final)
        run: |
          # Descargamos el agente de playit
          echo "Descargando agente de playit.gg v0.16.2..."
          wget -O playit https://github.com/playit-cloud/playit-agent/releases/download/v0.16.2/playit-linux-amd64
          chmod +x playit
          
          # Guardamos la salida de playit en un log
          echo "Iniciando túnel de playit.gg..."
          ./playit &> playit_output.log &
          
          # Esperamos a que el agente se conecte
          sleep 20
          
          # Mostramos las instrucciones, esta es la última información que verás
          echo "====================== ACCIÓN REQUERIDA ======================"
          echo " Ve a la siguiente URL para reclamar este túnel:"
          grep -o "https://playit.gg/claim/[^\s]*" playit_output.log
          echo ""
          echo " INSTRUCCIONES IMPORTANTES:"
          echo " 1. Abre el enlace, inicia sesión y reclama el túnel."
          echo " 2. Crea un túnel TCP para el puerto local (Local Port): 5900"
          echo " 3. Usa la dirección que te dé playit.gg en tu cliente VNC."
          echo "================================================================="
          echo ""
          echo "El sistema está listo y se mantendrá en ejecución..."

          # Bucle infinito para mantener el workflow y todos los procesos vivos
          while true; do
            sleep 60
          done
